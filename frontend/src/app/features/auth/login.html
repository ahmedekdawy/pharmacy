<section class="login">
  <a routerLink="/" class="brand">{{ t('BRAND.NAME') }}</a>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Tenant Code
      <input formControlName="tenantCode" autocomplete="organization" />
    </label>
    <label>
      Email
      <input type="email" formControlName="email" autocomplete="username" />
    </label>
    <label>
      Password
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    <app-icon-button icon="login" type="submit" tone="primary" [disabled]="loading()" [label]="t('LANDING.LOGIN')"></app-icon-button>
  </form>
</section>
