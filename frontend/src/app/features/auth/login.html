<section class="login">
  <a routerLink="/" class="brand">{{ t('BRAND.NAME') }}</a>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      {{ i18n.pick('Tenant Code', 'كود الصيدلية') }} <span class="req">*</span>
      <input formControlName="tenantCode" autocomplete="organization" />
      <app-field-error [control]="form.controls.tenantCode" [label]="i18n.pick('Tenant code', 'كود الصيدلية')" />
    </label>
    <label>
      {{ i18n.pick('Email or Mobile', 'البريد الإلكتروني أو الموبايل') }} <span class="req">*</span>
      <input type="text" formControlName="identifier" autocomplete="username" />
      <app-field-error [control]="form.controls.identifier" [label]="i18n.pick('Email or mobile', 'البريد الإلكتروني أو الموبايل')" />
    </label>
    <label>
      {{ i18n.pick('Password', 'كلمة المرور') }} <span class="req">*</span>
      <div class="password-row">
        <input [type]="showPassword() ? 'text' : 'password'" formControlName="password" autocomplete="current-password" />
        <button
          type="button"
          class="toggle-visibility"
          [attr.aria-label]="showPassword() ? i18n.pick('Hide password', 'إخفاء كلمة المرور') : i18n.pick('Show password', 'إظهار كلمة المرور')"
          (click)="showPassword.set(!showPassword())"
        >
          @if (showPassword()) {
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5c-1.6 0-3.1.3-4.5.9l1.6 1.6A7 7 0 0 1 19 12c-.4.6-.9 1.3-1.6 2l1.5 1.5c1.6-1.5 2.7-3 3.1-3.7a1 1 0 0 0 0-.8C21.3 9.5 17.5 5 12 5zM2.8 3.8 1.4 5.2l3 3C2.9 9.6 1.8 10.7 1.4 11.6a1 1 0 0 0 0 .8C2.7 14.5 6.5 19 12 19c1.3 0 2.6-.2 3.7-.6l3 3 1.4-1.4L2.8 3.8zM9.5 10.5l3.9 3.9A3 3 0 0 1 9 11a3 3 0 0 1 .5-.5z" fill="currentColor"/></svg>
          } @else {
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5C6.5 5 2.7 9.5 1.4 11.6a1 1 0 0 0 0 .8C2.7 14.5 6.5 19 12 19s9.3-4.5 10.6-6.6a1 1 0 0 0 0-.8C21.3 9.5 17.5 5 12 5zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z" fill="currentColor"/></svg>
          }
        </button>
      </div>
      <app-field-error [control]="form.controls.password" [label]="i18n.pick('Password', 'كلمة المرور')" />
    </label>
    <label class="remember-me">
      <input type="checkbox" formControlName="rememberMe" />
      {{ i18n.pick('Remember me', 'تذكرني') }}
    </label>
    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }
    <app-icon-button icon="login" type="submit" tone="primary" [disabled]="loading()" [label]="t('LANDING.LOGIN')"></app-icon-button>
  </form>
</section>
