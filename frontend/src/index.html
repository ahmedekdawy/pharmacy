<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <title>Pharmacy</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#1f6b4a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pharmacy">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('pharmacy.theme') === 'dark' ? 'dark' : 'light';
        var lang = localStorage.getItem('pharmacy.language') === 'en' ? 'en' : 'ar';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
