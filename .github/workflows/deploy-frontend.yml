name: Deploy Frontend (FTP / runasp.net)

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  pull_request:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  build:
    name: Build production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Inject production API URL
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -n "$API_BASE_URL" ]; then
            node -e "
              const fs = require('fs');
              const path = 'src/environments/environment.production.ts';
              const url = process.env.API_BASE_URL.replace(/'/g, \"\\\\'\");
              let text = fs.readFileSync(path, 'utf8');
              text = text.replace(/apiBaseUrl:\\s*'[^']*'/, \"apiBaseUrl: '\" + url + \"'\");
              fs.writeFileSync(path, text);
              console.log('Set apiBaseUrl to', url);
            "
          else
            echo "API_BASE_URL secret not set; keeping default 'https://pharmacyegapi.runasp.net/api/v1'."
          fi

      - name: Build
        run: npm run build -- --configuration production

      - name: Upload static artifact
        uses: actions/upload-artifact@v7
        with:
          name: pharmacy-web
          path: frontend/dist/frontend/browser
          if-no-files-found: error

  deploy-ftp:
    name: FTP Deploy (runasp.net)
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production-frontend

    steps:
      - name: Validate deploy secrets
        env:
          FRONTEND_FTP_SERVER: ${{ secrets.FRONTEND_FTP_SERVER }}
          FRONTEND_FTP_USERNAME: ${{ secrets.FRONTEND_FTP_USERNAME }}
          FRONTEND_FTP_PASSWORD: ${{ secrets.FRONTEND_FTP_PASSWORD }}
        run: |
          missing=0
          for var in FRONTEND_FTP_SERVER FRONTEND_FTP_USERNAME FRONTEND_FTP_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Secret '${var}' is not set. Add it in Settings → Secrets and variables → Actions, or under the 'production-frontend' environment."
              missing=1
            fi
          done
          exit $missing

      - name: Download static artifact
        uses: actions/download-artifact@v8
        with:
          name: pharmacy-web
          path: deploy

      - name: Deploy via FTP to runasp.net (site root)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FRONTEND_FTP_SERVER }}
          username: ${{ secrets.FRONTEND_FTP_USERNAME }}
          password: ${{ secrets.FRONTEND_FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./deploy/
          # Dedicated frontend FTP site (separate from the API host); Angular at site root
          server-dir: ${{ vars.FRONTEND_FTP_SERVER_DIR || './wwwroot/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
